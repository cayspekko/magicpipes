[workspace]
resolver = "3"
members = ["crates/magicpipes-core", "crates/magicpipes-server", "crates/magicpipes-cli"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
magicpipes-core = { path = "crates/magicpipes-core" }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "fs", "process"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
yamux = "0.14"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
axum = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
x509-parser = "0.18"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
getrandom = "0.3"
libc = "0.2"
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
mime = "0.3"
mime_guess = { version = "2", default-features = false }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
time = { version = "0.3", features = ["formatting"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
