# magicpipesd configuration.
#
# Requirements: a wildcard DNS record `*.<base_domain>` and an A/AAAA record for
# `management.hostname`, both pointing at this machine; ports 80, 443 and 8443 reachable.

# Tunnels are published as https://<name>.<base_domain>
base_domain = "t.example.com"

# SQLite database, certificates, ACME account and the bootstrap admin token live here.
data_dir = "/var/lib/magicpipes"

# Reverse proxies or load balancers in front of magicpipesd (CIDR), e.g. HAProxy. Only these may
# name the client: through a PROXY header where a listener has proxy_protocol = true, or
# X-Forwarded-For from an HTTP proxy. Client addresses drive login rate limits, per-client
# connection caps, --allow-cidr and the X-Forwarded-For that tunnels receive. Anyone else is
# the client, and the forwarding headers it sends are dropped. List only the proxy itself, not its
# whole network: anything at a listed address can name any client and skips per-client limits.
# trusted_proxies = ["172.23.0.2/32"]

[public]
https_listen = "0.0.0.0:443"
# Serves ACME HTTP-01 challenges and redirects everything else to HTTPS.
http_listen = "0.0.0.0:80"
# url_port = 443                     # port shown in public URLs (defaults to https_listen's port)
# max_connections = 10000
# max_connections_per_client = 64    # per client address (per /64 for IPv6); trusted proxies exempt
# header_read_timeout_secs = 30
# upstream_response_timeout_secs = 60  # for the app to start answering, after the request body (or its last chunk)
# websocket_idle_timeout_secs = 600
# body_idle_timeout_secs = 90         # close a connection after this long with no byte moving, so stalled uploads and
#                                     # downloads give their place back. Off by default: set it above any quiet period
#                                     # your applications have (long polling, server-sent events, slow responses)
# allow_cookie_domain = false         # let applications set cookies for the whole base domain, which reach other tunnels
#                                     # and the management host. Off: such a Domain is removed, so the cookie stays on its tunnel
# proxy_protocol = false             # true behind a TCP load balancer passing TLS through (HAProxy send-proxy-v2)

[management]
# Management UI, JSON API and the agent endpoint share this listener.
listen = "0.0.0.0:8443"
hostname = "example.com"
# cert_file = "/etc/magicpipes/mgmt.crt" # optional: externally provisioned certificate
# key_file  = "/etc/magicpipes/mgmt.key"
# proxy_protocol = false               # as in [public]
# max_connections = 1024                 # while they are HTTP: an agent's session stops counting once it has signed in
# max_connections_per_client = 64        # per client address (per /64 for IPv6); trusted proxies exempt

[tls]
# "acme"   - per-hostname certificates via ACME HTTP-01 (default)
# "files"  - an externally provisioned (usually wildcard) certificate
# "dev-ca" - a local development CA in data_dir/dev-ca (testing only)
mode = "acme"
# "letsencrypt", "letsencrypt-staging" or an ACME directory URL. Try staging first.
acme_directory = "letsencrypt"
# acme_email = "ops@example.com"
# acme_ca_root = "/path/to/pebble.minica.pem"   # extra root to trust for the ACME server
# cert_file = "/etc/magicpipes/wildcard.crt"    # mode = "files"
# key_file  = "/etc/magicpipes/wildcard.key"
# issuance_timeout_secs = 120
# failure_backoff_secs = 300
# Your own certificates, for the names they cover, in any mode. Files that change are picked up within
# 5 minutes, so another tool can renew them. You can also add them on the Settings page.
# [[tls.certificates]]
# cert_file = "/etc/magicpipes/shop.crt"
# key_file  = "/etc/magicpipes/shop.key"

[agents]
# session_timeout_secs = 45
# max_tunnels_per_agent = 50
# max_ports_per_agent = 10             # TCP/UDP ports one agent may hold
# max_new_certificates_per_day = 20    # ACME: new hostnames one agent may add per 24 hours
# enrollment_ttl_secs = 3600
# max_connections = 4                 # connections one agent may hold (1 to 8): 224 streams and up to 128 MiB in flight each

[monitoring]
# history_days = 7                     # days of 5-minute history for the Health page and charts (1 to 30)
# synthetics = true                    # check each tunnel's app through its machine (`add --no-check` skips one)
# check_interval_secs = 60             # how often (10 to 3600)

[users]
# Accounts are created by administrators in the UI (Users) or the API; see the README.
# session_max_age_secs = 43200         # how long a sign-in lasts
# audit_retention_days = 90
# bootstrap_admins = ["you@example.com"]  # verified emails that get an administrator's account at their first single sign-on
# allowed_email_domains = ["example.com"] # verified emails here get a member's account at their first single sign-on (exact domain)
# members_can_publish = true           # may members' machines create public tunnels? (checked on every new or changed one)
# max_agents_per_user = 25              # machines a member may enroll themself, counting unused tokens (0: no limit)
# sso_recheck_secs = 3600              # how often a single sign-on's session is checked with its provider (0: never)
# disable_idle_after_days = 0          # disable accounts that sign in only through single sign-on after this many days without one or a re-check (0: never); their next sign-in enables them

[ports]
# Raw TCP and UDP tunnels (`magicpipes add 5432 --tcp`, `add 53 --udp`). Off unless `range` is
# set. Every port in the range must be reachable from the internet for TCP and UDP (firewall,
# router forwarding; in Docker use network_mode: host, see docker-compose.yml).
# range = "65500-65535"
# bind = "0.0.0.0"
# public_host = "example.com"          # host in tcp:// and udp:// URLs (default: management.hostname)
# proxy_protocol = false               # as in [public]; the proxy must be in trusted_proxies
# max_connections = 10000              # open TCP connections across all port tunnels
# tcp_idle_timeout_secs = 3600          # close a TCP connection after this long with no byte moving. Off by default
# udp_idle_timeout_secs = 60
# udp_max_flows = 128                  # UDP clients tracked at once per tunnel; one address may hold an eighth

# The SSH gateway, for `magicpipes add 22 --ssh`: people reach machines with `ssh -J`. Off unless this
# is here. It must be reachable from the internet, and its host key is <data_dir>/ssh-host-key.
# [ssh]
# listen = "0.0.0.0:2222"
# public_host = "example.com"          # host in the commands people see (default: management.hostname)
# public_port = 2222                   # port in them, if a router maps it (default: the one in listen)
# proxy_protocol = false               # as in [public]; the proxy must be in trusted_proxies
# max_connections = 1024
# max_connections_per_client = 32

# Single sign-on: one section per OpenID Connect provider, one button each on the sign-in page.
# Register https://<management hostname>/auth/oidc/<id>/callback at the provider. Administrators can
# also add providers, and the two [users] lists above, on the Settings page; those are kept in the
# database. <data_dir>/magicpipesd.generated.toml always shows the settings in effect.
# [[oidc]]
# id = "google"                        # lowercase letters, digits, dashes; part of the callback URL
# label = "Google"                     # the button says "Continue with Google"
# issuer = "https://accounts.google.com"
# client_id = "1234.apps.googleusercontent.com"
# client_secret_file = "/etc/magicpipes/google-secret"
# link_by_email = false                # a first sign-in with a verified email reaches the account with that email
# trust_email = false                  # accept addresses it doesn't say it verified: anyone who can choose theirs there can use an address listed above
# allow_unverified_admin = false       # with trust_email: let those addresses become or take over administrators
# scopes = ["openid", "email", "profile"]  # add "groups" or "offline_access" if the provider needs asking
# auto_redirect = false                # the sign-in page goes straight here (one provider at most)
# sign_out = false                     # signing out here signs out there too; register <management>/signed-out
# kind = "github"                     # GitHub isn't OpenID Connect: its issuer is its address, such as
#                                      # https://github.com or a GitHub Enterprise Server's

# A mail server, for inviting people by email and for sign-in links when a password is forgotten. Or
# set it on the Settings page, which keeps the password in <data_dir>/smtp-password. Off unless present.
# [smtp]
# host = "smtp.example.com"
# username = "magicpipes@example.com"
# password_file = "/etc/magicpipes/smtp-password"
# from = "MagicPipes <magicpipes@example.com>"
# port = 587                           # the usual one: 587 with STARTTLS, 465 with TLS, 25 with none
# tls = "starttls"                     # or "implicit" (the default on port 465), or "none" for a relay on a network you trust, with no password
# ca_file = "/etc/magicpipes/smtp-ca.pem"  # a private CA, as well as the public ones

# Sign-in through an authenticating proxy that terminates TLS in front of the management host, such
# as oauth2-proxy, Authelia, Pomerium or Cloudflare Access. Passwords and [[oidc]] providers then
# aren't offered; an admin token still works. Off unless present.
# [proxy_auth]
# mode = "jwt"                         # the proxy forwards a signed token, checked here
# jwt_header = "Cf-Access-Jwt-Assertion"  # or Authorization, for a bearer token
# jwks_url = "https://team.cloudflareaccess.com/cdn-cgi/access/certs"
# issuer = "https://team.cloudflareaccess.com"
# audience = "your-application-audience"
# mode = "headers"                     # or a plain header, believed only from trusted_proxies
# user_header = "X-Forwarded-Email"    # with the shared secret, and with proxy_protocol off here
# secret_header = "X-MagicPipes-Proxy-Secret"
# secret_file = "/etc/magicpipes/proxy-secret"  # at least 16 characters
# groups_header = "X-Forwarded-Groups" # comma-separated groups, the claim `groups` for tag rules
# trust_email = false                  # accept addresses nothing says were verified: plain headers need this
# allow_unverified_admin = false       # with trust_email: let those addresses become or take over administrators
# auto_create = false                  # someone new with an accepted address gets a member account
# sign_out_url = "https://auth.example.com/logout"  # without it, there's no "Sign out" button
