[package]
name = "magicpipes-server"
description = "magicpipesd: the MagicPipes public tunnel server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "magicpipesd"
path = "src/main.rs"

[dependencies]
magicpipes-core.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
axum.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
rcgen.workspace = true
instant-acme.workspace = true
x509-parser.workspace = true
ironrdp-rdcleanpath.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
toml.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
socket2.workspace = true
argon2.workspace = true
hmac.workspace = true
sha2.workspace = true
ring.workspace = true
base64.workspace = true
webpki-roots.workspace = true
lettre.workspace = true
russh.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
# Tests that wait for a timeout run on tokio's paused clock (`start_paused`), so a slow runner
# can't make them fail.
tokio = { workspace = true, features = ["test-util"] }

# musl's allocator takes a global lock. See "Threads and memory" in docs/ARCHITECTURE.md.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc.workspace = true
