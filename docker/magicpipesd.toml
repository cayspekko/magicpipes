# magicpipesd configuration for the Docker image (see docker-compose.yml).
# Edit base_domain, management.hostname and acme_email; see magicpipesd.example.toml for all options.

base_domain = "t.example.com"
data_dir = "/data"            # the magicpipes-data volume
# Behind a reverse proxy (HAProxy, Traefik, ...) on a Docker network: its addresses, plus
# proxy_protocol = true in [public]/[management] if it passes TLS through with send-proxy-v2.
# trusted_proxies = ["172.16.0.0/12"]

[public]
https_listen = "0.0.0.0:443"
http_listen = "0.0.0.0:80"    # ACME HTTP-01 challenges + redirects

[management]
listen = "0.0.0.0:8443"
hostname = "example.com"

[tls]
mode = "acme"
acme_directory = "letsencrypt-staging"   # switch to "letsencrypt" once it works
# acme_email = "ops@example.com"

# [users]
# session_max_age_secs = 43200
# audit_retention_days = 90
# members_can_publish = true

# TCP/UDP port tunnels (`magicpipes add 5432 --tcp`). Also publish the range in
# docker-compose.yml.
# [ports]
# range = "65500-65535"
