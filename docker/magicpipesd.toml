# magicpipesd configuration for the Docker image (see docker-compose.yml).
# Edit base_domain, management.hostname and acme_email; see magicpipesd.example.toml for all options.

base_domain = "t.example.com"
data_dir = "/data"            # the magicpipes-data volume
# Behind a reverse proxy (HAProxy, Traefik, ...) on a Docker network: its addresses, plus
# proxy_protocol = true in [public]/[management] if it passes TLS through with send-proxy-v2.
# trusted_proxies = ["172.23.0.2/32"]   # the proxy's own address: anything listed can name any client

[public]
https_listen = "0.0.0.0:443"
http_listen = "0.0.0.0:80"    # ACME HTTP-01 challenges + redirects

[management]
listen = "0.0.0.0:8443"
hostname = "example.com"

[tls]
mode = "acme"
acme_directory = "letsencrypt-staging"   # switch to "letsencrypt" once it works
# acme_email = "ops@example.com"
# Your own certificates, for the names they cover (mount the files). You can also add them on the
# Settings page.
# [[tls.certificates]]
# cert_file = "/etc/magicpipes/shop.crt"
# key_file  = "/etc/magicpipes/shop.key"

# [users]
# session_max_age_secs = 43200
# audit_retention_days = 90
# members_can_publish = true
# bootstrap_admins = ["you@example.com"]
# allowed_email_domains = ["example.com"]

# Single sign-on with an OpenID Connect provider; mount the secret into the container. Or add
# providers on the Settings page, which keeps their secrets in the data volume.
# Register https://<management hostname>/auth/oidc/google/callback at the provider.
# [[oidc]]
# id = "google"
# label = "Google"
# issuer = "https://accounts.google.com"
# client_id = "1234.apps.googleusercontent.com"
# client_secret_file = "/etc/magicpipes/google-secret"
# link_by_email = false
# trust_email = false
# allow_unverified_admin = false
# kind = "github"     # for GitHub, with issuer = "https://github.com"

# A mail server, for inviting people by email and for sign-in links; mount the password into the
# container. Or set it on the Settings page, which keeps the password in the data volume.
# [smtp]
# host = "smtp.example.com"
# username = "magicpipes@example.com"
# password_file = "/etc/magicpipes/smtp-password"
# from = "MagicPipes <magicpipes@example.com>"

# Sign-in through an authenticating proxy that terminates TLS in front of the management host.
# Passwords and [[oidc]] providers then aren't offered; an admin token still works. See the README.
# [proxy_auth]
# mode = "jwt"
# jwt_header = "Cf-Access-Jwt-Assertion"
# jwks_url = "https://team.cloudflareaccess.com/cdn-cgi/access/certs"
# issuer = "https://team.cloudflareaccess.com"
# audience = "your-application-audience"
# trust_email = false
# auto_create = false
# sign_out_url = "https://auth.example.com/logout"

# TCP/UDP port tunnels (`magicpipes add 5432 --tcp`). Also publish the range in
# docker-compose.yml.
# [ports]
# range = "65500-65535"

# The SSH gateway (`magicpipes add 22 --ssh`, `ssh -J`). Also publish the port in docker-compose.yml.
# [ssh]
# listen = "0.0.0.0:2222"

# Connections one agent may hold at once (1 to 8; agents ask for 4). Each carries up to 224 streams
# and may have up to 128 MiB of data on its way here.
# [agents]
# max_connections = 4

# Days of 5-minute history the Health page and the charts on tunnel and machine pages keep (1 to 30).
# [monitoring]
# history_days = 7
