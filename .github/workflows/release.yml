# Runs when a GitHub release is published: tests, builds magicpipes + magicpipesd for four
# platforms, smoke-tests each build on its own OS, builds the server and agent images from the Linux
# builds, then attaches the archives, the bare binaries, SHA256SUMS and the signed manifest
# `--upgrade` reads (release.json and release.json.sig) to the release and pushes the images.
# Nothing is published unless every platform and both images pass. A release whose notes contain
# "[security]" is marked as a security fix, which servers raise an alert about until they have it.
#
# "Run workflow" (workflow_dispatch) is a dry run: the same tests, builds, smoke tests and images,
# with nothing published or pushed.

name: Build and release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
# The toolchain is pinned (dtolnay/rust-toolchain@1.99) to the workspace rust-version and the
# Dockerfile, so new compiler or clippy releases never break a release build.

jobs:
  name:
    name: Name the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag
        id: name
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_EVENT_NAME" != release ]]; then
            echo "Dry run of ${version} from ${GITHUB_REF_NAME}: nothing will be published."
            echo "tag=dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the release environment can sign, and it admits only tags matching v*.
          if [[ "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} should be v${version}: the release environment admits only tags matching v*."
            exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
            exit 1
          fi
          # Binaries report the workspace version, and compare it with the release's to decide
          # whether to upgrade, so the two must be the same.
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version ${version} in Cargo.toml."
            exit 1
          fi
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: [name, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-2022
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          # C dependencies (ring, bundled SQLite) must be compiled against musl, not glibc.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} --bin magicpipes --bin magicpipesd

      - name: Check Linux binaries are static
        if: contains(matrix.target, 'musl')
        run: |
          for b in target/${{ matrix.target }}/release/magicpipes target/${{ matrix.target }}/release/magicpipesd; do
            file "$b"
            if ldd "$b" 2>&1 | grep -q '=>'; then echo "::error::$b is dynamically linked"; exit 1; fi
          done

      - name: Smoke test
        timeout-minutes: 10
        run: scripts/smoke-test.sh target/${{ matrix.target }}/release

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.name.outputs.tag }}
        run: |
          name="magicpipes-${TAG}-${TARGET}"
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=".exe"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/magicpipes$ext" "target/$TARGET/release/magicpipesd$ext" "dist/$name/"
          cp README.md LICENSE magicpipesd.example.toml "dist/$name/"
          assets=crates/magicpipes-core/assets/terminal
          cp "$assets/LICENSE" "dist/$name/LICENSE-xterm.js"
          cp "$assets/LICENSE-addon-fit" "dist/$name/LICENSE-xterm-addon-fit"
          cp "$assets/LICENSE-addon-unicode11" "dist/$name/LICENSE-xterm-addon-unicode11"
          cp "$assets/LICENSE-nerd-fonts" "dist/$name/LICENSE-nerd-fonts"
          cp crates/magicpipes-server/src/mgmt/assets/LICENSE-lucide "dist/$name/LICENSE-lucide"
          cp crates/magicpipes-server/src/mgmt/assets/desktop/LICENSE-ironrdp-MIT "dist/$name/LICENSE-ironrdp-MIT"
          cp crates/magicpipes-server/src/mgmt/assets/desktop/LICENSE-ironrdp-APACHE "dist/$name/LICENSE-ironrdp-APACHE"
          cp crates/magicpipes-server/src/mgmt/assets/desktop/LICENSE-svelte "dist/$name/LICENSE-svelte"
          novnc=crates/magicpipes-server/src/mgmt/assets/vnc/novnc
          cp "$novnc/LICENSE.txt" "dist/$name/LICENSE-novnc"
          cp "$novnc/docs/LICENSE.MPL-2.0" "dist/$name/LICENSE-novnc-MPL-2.0"
          cp "$novnc/docs/LICENSE.BSD-2-Clause" "dist/$name/LICENSE-novnc-BSD-2-Clause"
          cp "$novnc/docs/LICENSE.BSD-3-Clause" "dist/$name/LICENSE-novnc-BSD-3-Clause"
          cp "$novnc/vendor/pako/LICENSE" "dist/$name/LICENSE-pako"
          # The bare binaries, for `--upgrade` (scripts/release-manifest.py lists them).
          mkdir -p dist/upload
          cp "target/$TARGET/release/magicpipes$ext" "dist/upload/magicpipes-${TAG}-${TARGET}$ext"
          cp "target/$TARGET/release/magicpipesd$ext" "dist/upload/magicpipesd-${TAG}-${TARGET}$ext"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            7z a -tzip -bso0 "upload/$name.zip" "$name"
          else
            tar -czf "upload/$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/upload/*
          if-no-files-found: error

  images:
    name: Images
    needs: [name, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-linux-musl'
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Build the images
        run: scripts/release-images.sh dist "${{ needs.name.outputs.tag }}"

  publish:
    name: Publish release assets
    needs: [build, images]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The signing key is a secret of this environment, so only this job can read it.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS
      - name: Sign the manifest
        env:
          RELEASE_KEY: ${{ secrets.MAGICPIPES_RELEASE_KEY }}
          NOTES: ${{ github.event.release.body }}
        run: |
          if [[ -z "$RELEASE_KEY" ]]; then
            echo "::error::The release environment has no MAGICPIPES_RELEASE_KEY secret (scripts/release-key.sh makes one)."
            exit 1
          fi
          security=""
          [[ "$NOTES" == *"[security]"* ]] && security="--security"
          python3 src/scripts/release-manifest.py "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" dist $security > dist/release.json
          key="$RUNNER_TEMP/release-key.pem"
          (umask 077; printf '%s\n' "$RELEASE_KEY" > "$key")
          # Binaries trust only the keys built into them: signing with another would publish a
          # release nothing installs.
          pub=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64 -w0)
          if ! grep -qF "\"$pub\"" src/crates/magicpipes-core/src/release.rs; then
            rm -f "$key"
            echo "::error::The signing key's public half ($pub) isn't in RELEASE_KEYS in crates/magicpipes-core/src/release.rs."
            exit 1
          fi
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/release.json -out "$RUNNER_TEMP/release.sig"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-pub.pem"
          rm -f "$key"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-pub.pem" -rawin -in dist/release.json -sigfile "$RUNNER_TEMP/release.sig"
          base64 -w0 "$RUNNER_TEMP/release.sig" > dist/release.json.sig
          cat dist/release.json
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  push-images:
    name: Push images
    # After the release's files, so images never exist for a release whose files didn't publish.
    needs: [name, images, publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The registry's address and credentials are this environment's, like the signing key.
    environment: release
    steps:
      - name: Check the registry settings
        id: registry
        env:
          REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
        run: |
          if [[ -z "$REPOSITORY" ]]; then
            echo "::notice::No images pushed: the release environment has no IMAGE_REPOSITORY variable."
            echo "push=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$USERNAME" || -z "$PASSWORD" ]]; then
            echo "::error::IMAGE_REPOSITORY is set, but the release environment lacks the IMAGE_REGISTRY_USERNAME or IMAGE_REGISTRY_PASSWORD secret."
            exit 1
          fi
          echo "push=1" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.registry.outputs.push
      - uses: actions/download-artifact@v4
        if: steps.registry.outputs.push
        with:
          pattern: '*-linux-musl'
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
        if: steps.registry.outputs.push
      - name: Sign in to the registry
        if: steps.registry.outputs.push
        env:
          REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
          USERNAME: ${{ secrets.IMAGE_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.IMAGE_REGISTRY_PASSWORD }}
        run: printf '%s' "$PASSWORD" | docker login "${REPOSITORY%%/*}" -u "$USERNAME" --password-stdin
      - name: Push the images
        if: steps.registry.outputs.push
        env:
          REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
        run: scripts/release-images.sh dist "${{ needs.name.outputs.tag }}" --push "$REPOSITORY"
